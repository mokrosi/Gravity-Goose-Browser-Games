<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060212"/>
      <stop offset="50%" stop-color="#180731"/>
      <stop offset="100%" stop-color="#340b4e"/>
    </linearGradient>

    <linearGradient id="sun-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0077" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-sky)"/>

  <!-- Pixelated Stars -->
  <g fill="#ffffff" opacity="0.8" shape-rendering="crispEdges">
    <rect x="100" y="80" width="4" height="4"/>
    <rect x="250" y="140" width="6" height="6" fill="#00f3ff"/>
    <rect x="420" y="60" width="4" height="4"/>
    <rect x="580" y="120" width="4" height="4"/>
    <rect x="750" y="50" width="6" height="6" fill="#ff0077"/>
    <rect x="920" y="100" width="4" height="4"/>
    <rect x="1100" y="70" width="6" height="6"/>
    <rect x="180" y="220" width="4" height="4"/>
    <rect x="340" y="280" width="4" height="4"/>
    <rect x="860" y="200" width="6" height="6" fill="#00f3ff"/>
    <rect x="1020" y="260" width="4" height="4"/>
  </g>

  <!-- Synthwave Sun -->
  <circle cx="600" cy="280" r="160" fill="url(#sun-gradient)" filter="url(#neon-glow)"/>
  
  <!-- Sun Cuts / Stripes -->
  <g fill="#180731">
    <rect x="420" y="270" width="360" height="6"/>
    <rect x="420" y="290" width="360" height="8"/>
    <rect x="420" y="312" width="360" height="10"/>
    <rect x="420" y="336" width="360" height="14"/>
    <rect x="420" y="364" width="360" height="18"/>
    <rect x="420" y="396" width="360" height="24"/>
  </g>

  <!-- Synthwave Grid Perspective Floor -->
  <g stroke="url(#grid-glow)" stroke-width="2">
    <!-- Horizontal Lines -->
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="445" x2="1200" y2="445"/>
    <line x1="0" y1="475" x2="1200" y2="475"/>
    <line x1="0" y1="515" x2="1200" y2="515"/>
    <line x1="0" y1="565" x2="1200" y2="565"/>
    <line x1="0" y1="625" x2="1200" y2="625"/>

    <!-- Perspective Rays -->
    <line x1="600" y1="400" x2="-200" y2="630"/>
    <line x1="600" y1="400" x2="0" y2="630"/>
    <line x1="600" y1="400" x2="200" y2="630"/>
    <line x1="600" y1="400" x2="400" y2="630"/>
    <line x1="600" y1="400" x2="600" y2="630"/>
    <line x1="600" y1="400" x2="800" y2="630"/>
    <line x1="600" y1="400" x2="1000" y2="630"/>
    <line x1="600" y1="400" x2="1200" y2="630"/>
    <line x1="600" y1="400" x2="1400" y2="630"/>
  </g>

  <!-- Left Goose (Normal Gravity) -->
  <g transform="translate(140, 240)" shape-rendering="crispEdges">
    <rect x="20" y="60" width="60" height="40" fill="#ffffff"/>
    <rect x="50" y="20" width="30" height="50" fill="#ffffff"/>
    <rect x="65" y="25" width="25" height="12" fill="#00f3ff" filter="url(#neon-glow)"/>
    <rect x="75" y="40" width="30" height="12" fill="#ff6600"/>
    <rect x="35" y="100" width="8" height="20" fill="#ff6600"/>
    <rect x="55" y="100" width="8" height="20" fill="#ff6600"/>
    <path d="M 55 -20 L 75 10 L 63 10 V 40 H 47 V 10 H 35 Z" fill="#00f3ff" filter="url(#neon-glow)"/>
  </g>

  <!-- Right Goose (Flipped Gravity) -->
  <g transform="translate(940, 260) scale(1, -1)" shape-rendering="crispEdges">
    <rect x="20" y="60" width="60" height="40" fill="#ffffff"/>
    <rect x="50" y="20" width="30" height="50" fill="#ffffff"/>
    <rect x="65" y="25" width="25" height="12" fill="#ff0077" filter="url(#neon-glow)"/>
    <rect x="75" y="40" width="30" height="12" fill="#ff6600"/>
    <rect x="95" y="42" width="20" height="20" fill="#ffcc00"/>
    <rect x="35" y="100" width="8" height="20" fill="#ff6600"/>
    <rect x="55" y="100" width="8" height="20" fill="#ff6600"/>
    <path d="M 55 -20 L 75 10 L 63 10 V 40 H 47 V 10 H 35 Z" fill="#ff0077" filter="url(#neon-glow)"/>
  </g>

  <!-- Title Badge -->
  <rect x="220" y="70" width="760" height="120" rx="16" fill="#060212" opacity="0.85" stroke="#00f3ff" stroke-width="3" filter="url(#neon-glow)"/>

  <!-- Main Title Text -->
  <text x="600" y="125" font-family="'Courier New', monospace, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#text-glow)">GRAVITY GOOSE</text>
  <text x="600" y="165" font-family="'Courier New', monospace, sans-serif" font-size="20" font-weight="bold" fill="#ff0077" text-anchor="middle" letter-spacing="4" filter="url(#text-glow)">THE BREAD ROBBERY</text>

  <!-- Subtitle Tagline -->
  <rect x="250" y="490" width="700" height="50" rx="12" fill="#180731" stroke="#ff0077" stroke-width="2"/>
  <text x="600" y="522" font-family="'Courier New', monospace, sans-serif" font-size="14" font-weight="bold" fill="#00f3ff" text-anchor="middle" filter="url(#text-glow)">ALIENS STOLE YOUR SANDWICH. STEAL THEIR GRAVITY!</text>
</svg>
