<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/images/banana.png" rel="icon">
    <title>Glitch Macaque: Cyber Escape</title>
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-item">
                <img src="assets/images/banana.png" width="24" /> 
                <span id="banana-count">0</span>
            </div>
            <div class="hud-item">
                LEVEL <span id="level-indicator">1</span>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="screen">
            <h1 class="title">GLITCH MACAQUE</h1>
            <p class="subtitle">Cyber Escape</p>
            <button id="btn-start" class="btn">INITIALIZE</button>
        </div>

        <!-- Level Transition -->
        <div id="level-screen" class="screen hidden">
            <h2 id="level-title">SYSTEM PARTITION 1</h2>
        </div>
        
        <!-- Game Over -->
        <div id="game-over" class="screen hidden">
            <h1 class="text-danger">SYSTEM FAILURE</h1>
            <button id="btn-restart" class="btn">REBOOT</button>
        </div>
    </div>

    <canvas class="board"></canvas>

    <script src="js/preload.js" defer></script>
    <script src="assets/map/levels/level1.js" defer></script>
    <script src="assets/map/levels/level2.js" defer></script>
    <script src="assets/map/levels/level3.js" defer></script>
    <script src="assets/map/levels/level4.js" defer></script>
    <script src="assets/map/levels/level5.js" defer></script>
    <script src="assets/map/levels/index.js" defer></script>
    
    <script src="js/nano.js" defer></script>
    <script src="entity/block.js" defer></script>
    <script src="entity/bug.js" defer></script>
    <script src="entity/bricks.js" defer></script>
    <script src="entity/particles.js" defer></script>
    <script src="entity/banana.js" defer></script>
    
    <script src="js/bgblueprint.js" defer></script>
    <script src="js/levelBuilder.js" defer></script>
    <script src="js/input.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/animation.js" defer></script>
    <script src="js/movement.js" defer></script>
    <script src="js/physics.js" defer></script>
    <script src="js/game.js" defer></script>
</body>
</html>
